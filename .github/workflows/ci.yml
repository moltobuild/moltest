name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # release.yml runs this same CI before it publishes anything.
  workflow_call:

# A push that supersedes another cancels it: the result of a commit that is no
# longer the tip settles nothing.
#
# "-ci" in the group: called from release.yml, github.workflow is "Release", and
# a group shared with the caller would let one cancel the other.
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

# The molto that builds moltest, pinned like a dependency: a new molto release
# reaches this file in a diff, never behind a red build nobody caused here.
# The compiler is named with C_COMPILER, which skips pickup on purpose: what is
# under test is moltest, and a red has to be attributable to it.
env:
  MOLTO_VERSION: "0.46.0"
  MOLTO_SOURCE_REF: "9da5c0c4b53a0135c0964403c9846317a2236ebc"
  MOLTO_RELEASES: https://github.com/moltobuild/molto/releases/download
  LLVM_VERSION: "19"

jobs:
  # moltest's own suite, built the way a contributor builds it.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            asset: x86_64-linux
            cc: gcc
            sha: sha256sum
          - os: macos
            runner: macos-14
            asset: arm64-macos
            cc: clang
            sha: shasum -a 256
    env:
      C_COMPILER: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the pinned Molto revision
        run: ./.github/install-molto.sh "${{ matrix.asset }}" "${{ matrix.sha }}"
      - run: molto build
      - run: molto package
      - run: molto build --profile release
      - run: molto test

  # Windows apart because its shell is: MSYS2 for the gcc it brings.
  test-windows:
    name: Test (windows)
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    env:
      C_COMPILER: gcc
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: msys2/setup-msys2@v2.32.0
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make git
      - name: Install the pinned Molto revision
        run: ./.github/install-molto.sh x86_64-windows.exe sha256sum
      - run: molto build
      - run: molto package
      - run: molto build --profile release
      - run: molto test

  # What a user of moltest gets: a project made by `molto new`, with this
  # checkout as its dev-dependency. That reads the public manifest interface, which
  # moltest's own suite never reads.
  consumer:
    name: Consumer (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            asset: x86_64-linux
            cc: gcc
            sha: sha256sum
          - os: macos
            runner: macos-14
            asset: arm64-macos
            cc: clang
            sha: shasum -a 256
    env:
      C_COMPILER: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the pinned Molto revision
        run: ./.github/install-molto.sh "${{ matrix.asset }}" "${{ matrix.sha }}"
      - name: A new library tests itself with this moltest
        run: ./.github/consumer.sh "$GITHUB_WORKSPACE"

  consumer-windows:
    name: Consumer (windows)
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    env:
      C_COMPILER: gcc
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: msys2/setup-msys2@v2.32.0
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make git
      - name: Install the pinned Molto revision
        run: ./.github/install-molto.sh x86_64-windows.exe sha256sum
      - name: A new library tests itself with this moltest
        run: ./.github/consumer.sh "$PWD"

  # Formatting and static analysis with the LLVM molto's own CI pins.
  #
  # Not a gate yet: the sources inherited from molto were never formatted with
  # the molto preset (KNOWN_ISSUES KI-1) and lint reports 13 warnings (KI-2).
  # The job runs so the numbers are visible on every PR; removing
  # `continue-on-error` from its two checks is the last step of closing those
  # issues. It sits on the steps, not the job: a job that is allowed to fail
  # still shows as a red check on the PR, which reads as a broken build.
  style:
    name: Style (not yet a gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      C_COMPILER: gcc
      MOLTO_CLANG_FORMAT: /usr/bin/clang-format-19
      MOLTO_CLANG_TIDY: /usr/bin/clang-tidy-19
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          sudo add-apt-repository -y \
            "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main"
          sudo apt-get install -y -o Acquire::Retries=3 \
            clang-format-${LLVM_VERSION} clang-tidy-${LLVM_VERSION}
      - name: Install the pinned Molto revision
        run: ./.github/install-molto.sh x86_64-linux sha256sum
      - run: molto fmt --check
        continue-on-error: true
      - run: molto lint
        continue-on-error: true
