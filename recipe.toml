# How a consumer compiles moltest (RFC-0009 in molto). Project.toml builds and
# tests moltest itself; this file is what `molto add moltest --dev` reads.
schema = 1
form = "source"
kind = "package"
name = "moltest"
version = "0.3.0"
target = "any"

[artifacts]
type = "source"
std = "c2x"
sources = ["src/moltest.c", "src/moltest_main.c"]
include = ["include"]
# Interface: moltest.h's inline helpers call mkdtemp and realpath, which glibc
# hides under a strict -std unless this is defined, and they are compiled in
# the consumer's tests. Harmless where libc shows them anyway.
defines = ["_DEFAULT_SOURCE"]

[artifacts.private]
# moltest.c prints sizes with %zu, which mingw's default printf does not know.
defines = ["__USE_MINGW_ANSI_STDIO=1"]

[about]
description = "A small unit-testing framework for C and C++, the official tester of the Molto ecosystem"
license = "Apache-2.0"
homepage = "https://github.com/moltobuild/moltest"
